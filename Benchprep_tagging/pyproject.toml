[project]
name = "backend"
version = "0.0.1"
description = "API for interacting with an AI tutor"
authors = [
    {name = "Satyam Chaudhari", email = "satyam.chaudhari@iauro.com"}
]
readme = "README.md"
requires-python = "3.11.11"
dependencies = [
    "langchain-postgres (>=0.0.12,<0.0.13)",
    "langchain (>=0.3.14,<0.4.0)",
    "langchain-openai (>=0.3.0,<0.4.0)",
    "langchain-community (>=0.3.14,<0.4.0)",
    "langchain-core (>=0.3.29,<0.4.0)",
    "boto3 (>=1.35.99,<2.0.0)",
    "botocore (>=1.35.99,<2.0.0)",
    "dynaconf[dotenv] (>=3.2.11,<4.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "faiss-cpu (>=1.9.0.post1,<2.0.0)",
    "opensearch-py (>=2.8.0,<3.0.0)",
    "snowflake-connector-python[pandas] (>=3.13.2,<4.0.0)",  # ✅ kept only one version
    "snowflake-snowpark-python (>=1.31.0,<2.0.0)",
    "html2text (>=2024.2.26,<2025.0.0)",
    "sqlalchemy-utils (>=0.41.2,<0.42.0)",
    "pymupdf (>=1.25.1,<2.0.0)",
    "sqlalchemy (>=2.0.37,<3.0.0)",
    "langgraph-checkpoint-postgres (>=2.0.11,<3.0.0)",
    "fastapi[standard] (>=0.115.8,<0.116.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "newrelic (>=10.4.0,<11.0.0)",
    "pybrake (>=1.10.1,<2.0.0)",
    "setuptools (>=75.8.0,<76.0.0)",
    "langgraph (>=0.2.63,<0.3.0)",
    "ipython (>=8.31.0,<9.0.0)",
    "tomli (>=2.2.1,<3.0.0)",
    "pytest (>=8.3.4,<9.0.0)",
    "pytest-asyncio (>=0.25.3,<0.26.0)",
    "invoke (>=2.2.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "requests-aws4auth (>=1.3.1,<2.0.0)",
    "coverage (>=7.6.12,<8.0.0)",
    "debugpy (>=1.8.13,<2.0.0)",
    "celery (>=5.5.0,<6.0.0)",
    "redis (>=5.2.1,<6.0.0)",
    "alembic (>=1.15.2,<2.0.0)",
    "tzdata (>=2025.2,<2026.0)",
    "flower (>=2.0.1,<3.0.0)",
    "flagsmith (>=3.9.1,<4.0.0)",
    "distlib (>=0.4.0,<0.5.0)",
]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.poetry]
package-mode = false  # ✅ allows Poetry to use [project] table

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"